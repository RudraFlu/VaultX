{% extends "base.html" %}

{% block title %}Register | VaultX{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h2 class="mb-4">Create Your VaultX Account</h2>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Register
                </button>
            </form>

            <p class="mt-3">
                Already have an account?
                <a href="{% url 'login' %}">Login here</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}
