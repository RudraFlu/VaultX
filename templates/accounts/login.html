{% extends "base.html" %}

{% block title %}Login | VaultX{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h2 class="mb-4">Login</h2>

            <form method="POST">
                {% csrf_token %}

        <div>
            <label for="email">College Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="rollno@mail.jiit.ac.in"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >
        </div>

                <button type="submit" class="btn btn-primary">
                    Login
                </button>
            </form>

            <p class="mt-3">
                Don't have an account?
                <a href="{% url 'register' %}">Register</a>
            </p>

        </div>
    </div>
</div>

{% endblock %}
