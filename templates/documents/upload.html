{% extends "base.html" %}

{% block title %}Upload Document | VaultX{% endblock %}

{% block content %}

<div class="container py-5">

    <h2 class="mb-4">Upload Document</h2>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Upload Document
                </button>
            </form>

            <p class="mt-3">
                <a href="{% url 'my_vault' %}" class="btn btn-outline-primary">
                    Back to My Vault
                </a>
            </p>

        </div>
    </div>

</div>

{% endblock %}
